[project]
name = "sip-sim"
version = "0.2.0"
description = "Generalized process simulation engine with stigmergic attention models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
neural = [
    "torch>=2.10.0",
    "tiktoken>=0.12.0",
]
experiments = [
    "torch>=2.10.0",
    "tiktoken>=0.12.0",
    "pandas>=3.0.1",
    "datasets>=4.7.0",
]
all = [
    "torch>=2.10.0",
    "tiktoken>=0.12.0",
    "pandas>=3.0.1",
    "datasets>=4.7.0",
]

[project.scripts]
sip-sim = "sip_sim.__main__:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
